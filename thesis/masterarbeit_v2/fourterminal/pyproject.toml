[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_functions"
version = "0.1.0"
description = "NEGF package for the 4-terminal Josephson junction simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "ipython",
]

[tool.setuptools]
packages = ["my_functions"]
