[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-transport"
version = "0.1.0"
description = "Thermal transport utilities and simulations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "ipython",
]

[tool.setuptools]
packages = ["modules"]
